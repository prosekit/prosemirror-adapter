packages:
  - 'packages/*'
  - 'examples/*'
  - e2e

allowBuilds:
  esbuild: false
  sharp: false

strictPeerDependencies: true

linkWorkspacePackages: deep

dedupePeers: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@ocavue/eslint-config@4.11.0'
  - eslint-plugin-unicorn@71.0.0
